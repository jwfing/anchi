    <path d="M9 42Q32 39.6 55 42Q32 44.4 9 42Z" fill="#fff" opacity=".6" filter="url(#glow)"/>
    <path d="M9 42Q32 39.6 55 42Q32 44.4 9 42Z" fill="#fff"/>
