name: Linux live validation

# Installs the guest from scratch on an x86_64 runner, the way a remote server is set up
# (ANCHI_GUEST=local: the machine itself is the guest), installs the trusted services and the
# agent team, then runs the service and isolation checks. Synthetic credentials only: no Codex or
# Claude login, no Google, no model calls.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  # Pushes that can change what runs inside the guest also run the live check on their branch.
  push:
    paths:
      - '.github/workflows/linux-live.yml'
      - 'guest/**'
      - 'scripts/**'
      - 'services/**'
      - 'systemd/**'
      - 'anchi/packages/cell-runner/**'

permissions:
  contents: read

jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANCHI_GUEST: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: anchi/package.json
      - run: pnpm --dir anchi install --frozen-lockfile
      - name: Build and check the Linux distribution
        run: |
          bash scripts/package-release.sh
          python3 scripts/check-release.py artifacts/releases/anchi-linux-x64.tar.gz
          mkdir -p /tmp/anchi-release-live
          tar -xzf artifacts/releases/anchi-linux-x64.tar.gz -C /tmp/anchi-release-live
      - name: Install the guest onto this runner using the packaged setup resources
        run: |
          bash /tmp/anchi-release-live/anchi/scripts/up.sh
          bash /tmp/anchi-release-live/anchi/scripts/install-anchi.sh
      - name: Isolation and service checks
        run: bash scripts/verify.sh
      - name: Vault, base image and a synthetic Codex account
        # The token is well-formed but belongs to no account; the agent-team checks never call
        # a model, and the proxy never forwards it anywhere they reach.
        run: |
          node scripts/vault.mjs init
          sudo -n anchi-image build codex base
          python3 - <<'PY' | sudo -n /usr/bin/python3 /opt/secure-vm/services/codex_admin.py import-token
          import base64, json, time
          b64 = lambda v: base64.urlsafe_b64encode(json.dumps(v).encode()).decode().rstrip('=')
          claims = {'exp': int(time.time()) + 7200, 'https://api.openai.com/auth': {'chatgpt_account_id': 'ci-synthetic'}}
          token = f"{b64({'alg': 'none'})}.{b64(claims)}.{'s' * 80}"
          print(json.dumps({'access_token': token, 'account_id': 'ci-synthetic'}))
          PY
      - name: Agent-team isolation checks
        # Hosted runners are slower than a real server; the 100 ms target is for real servers.
        run: make verify-anchi START_BUDGET_MS=250
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p logs
          for unit in anchi-egress secure-auth secure-gmail; do
            sudo -n journalctl -u "$unit" --no-pager > "logs/$unit.log" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guest-logs
          path: logs
          if-no-files-found: ignore
