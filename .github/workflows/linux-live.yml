name: Linux live validation

# Creates the guest from scratch on an x86_64 runner with KVM, installs the trusted services
# and the agent team, then runs the service and isolation checks. Synthetic credentials only:
# no Codex or Claude login, no Google, no model calls.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  # Pushes that can change what runs inside the guest also run the live check on their branch.
  push:
    paths:
      - '.github/workflows/linux-live.yml'
      - 'lima/**'
      - 'guest/**'
      - 'scripts/**'
      - 'services/**'
      - 'systemd/**'
      - 'anchi/packages/cell-runner/**'

permissions:
  contents: read

jobs:
  kvm-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANCHI_INSTALL_VM: secure-vm-live-test
      LIMA_VERSION: 2.2.0
      LIMA_SHA256: a0ea1ccf6b7335a900adb5f8d2b8384457965fecb1ba72f09b4e3e46d12f424a
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: anchi/package.json
      - run: pnpm --dir anchi install --frozen-lockfile
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          qemu-system-x86_64 --version | head -1
      - name: Install Lima (pinned, checksum verified)
        run: |
          curl -fsSL -o lima.tgz "https://github.com/lima-vm/lima/releases/download/v$LIMA_VERSION/lima-$LIMA_VERSION-Linux-x86_64.tar.gz"
          echo "$LIMA_SHA256  lima.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/lima" && tar -xzf lima.tgz -C "$HOME/.local/lima"
          echo "$HOME/.local/lima/bin" >> "$GITHUB_PATH"
      - run: limactl --version
      - name: Create the guest and install the trusted services and the agent team
        run: |
          bash scripts/up.sh
          bash scripts/install-anchi.sh
      - name: Isolation and service checks
        run: bash scripts/verify.sh
      - name: Vault, base image and a synthetic Codex account
        # The token is well-formed but belongs to no account; the agent-team checks never call
        # a model, and the proxy never forwards it anywhere they reach.
        run: |
          python3 scripts/vault.py init
          limactl shell "$ANCHI_INSTALL_VM" -- sudo anchi-image build codex base
          python3 - <<'PY' | limactl shell "$ANCHI_INSTALL_VM" -- sudo /usr/bin/python3 /opt/secure-vm/services/codex_admin.py import-token
          import base64, json, time
          b64 = lambda v: base64.urlsafe_b64encode(json.dumps(v).encode()).decode().rstrip('=')
          claims = {'exp': int(time.time()) + 7200, 'https://api.openai.com/auth': {'chatgpt_account_id': 'ci-synthetic'}}
          token = f"{b64({'alg': 'none'})}.{b64(claims)}.{'s' * 80}"
          print(json.dumps({'access_token': token, 'account_id': 'ci-synthetic'}))
          PY
      - name: Agent-team isolation checks
        # Nested KVM on hosted runners is slower than a real host; the 100 ms target is for real hosts.
        run: make verify-anchi VM="$ANCHI_INSTALL_VM" START_BUDGET_MS=250
      - name: Collect Lima logs
        if: always()
        run: |
          mkdir -p logs
          cp "$HOME/.lima/$ANCHI_INSTALL_VM"/*.log logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lima-logs
          path: logs
          if-no-files-found: ignore
      - name: Delete the guest
        if: always()
        run: limactl delete -f "$ANCHI_INSTALL_VM" || true
