# Setup guides the desktop app links to, by connector. A released app keeps its links, so they
# point here and this map follows the documentation when it moves.
map $uri $anchi_guide {
    /docs/connect/github    CONNECTORS.md#github;
    /docs/connect/aws       CONNECTORS.md#aws;
    /docs/connect/linear    CONNECTORS.md#linear;
    /docs/connect/posthog   CONNECTORS.md#posthog;
    /docs/connect/sentry    CONNECTORS.md#sentry;
    /docs/connect/firecrawl CONNECTORS.md#firecrawl;
    /docs/connect/figma     CONNECTORS.md#figma;
    /docs/connect/discord   CONNECTORS.md#discord;
    /docs/connect/gmail     CONNECTORS.md#gmail;
    /docs/connect/drive     CONNECTORS.md#google-drive;
    /docs/connect/notion    CONNECTORS.md#notion;
    /docs/connect/slack     CONNECTORS.md#slack;
    /docs/connect/x         X_SETUP.md#connect-your-account;
    /docs/connect/reddit    REDDIT_SETUP.md#connect-your-account;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /docs/connect/ {
        if ($anchi_guide = "") {
            return 404;
        }
        return 302 https://github.com/jwfing/anchi/blob/main/docs/$anchi_guide;
    }
}
