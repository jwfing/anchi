name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["release/**"]

permissions:
  contents: read

jobs:
  images:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build release layers in a disposable container without accounts
        run: |
          mkdir -p artifacts/prebuilt
          docker run --rm --privileged \
            -v "$PWD:/src:ro" -v "$PWD/artifacts/prebuilt:/output" \
            debian:bookworm bash /src/scripts/build-prebuilt.sh
      - uses: actions/upload-artifact@v6
        with:
          name: anchi-images-${{ matrix.arch }}
          path: artifacts/prebuilt/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: anchi-manifest-${{ matrix.arch }}
          path: artifacts/prebuilt/prebuilt-*.json
          if-no-files-found: error

  package:
    needs: images
    strategy:
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            arch: aarch64
          - os: ubuntu-22.04
            target: linux-x64
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: anchi/package.json
      - run: pnpm --dir anchi install --frozen-lockfile
      - run: python -m pip install -r requirements-test.txt
      - run: make check PYTHON=python
      - name: Check release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./anchi/package.json').version")"
      - uses: actions/download-artifact@v7
        with:
          name: anchi-manifest-${{ matrix.arch }}
          path: artifacts/prebuilt
      - run: bash scripts/package-release.sh
        env:
          ANCHI_PREBUILT_MANIFEST: artifacts/prebuilt/prebuilt-${{ matrix.arch }}.json
      - run: python scripts/check-release.py artifacts/releases/anchi-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: anchi-${{ matrix.target }}
          path: artifacts/releases/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare version-specific release notes
        run: python3 scripts/release-notes.py "$GITHUB_REF_NAME" > release-notes.md
      - uses: actions/download-artifact@v7
        with:
          pattern: anchi-*
          path: release
          merge-multiple: true
      - name: Publish development release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --title "Anchi $GITHUB_REF_NAME (development preview)" \
            --notes-file release-notes.md
