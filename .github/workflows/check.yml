name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning -x scripts/*.sh guest/*.sh guest/cell-run
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: anchi/package.json
      - run: pnpm --dir anchi install --frozen-lockfile
      - run: make check PYTHON=python
