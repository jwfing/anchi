<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>安栖 · 本地 Agent</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <nav aria-label="主导航">
        <div class="nav-head">
          <div class="brand">◈ 安栖</div>
          <button id="sidebar-toggle" aria-label="收起导航" aria-expanded="true" title="收起导航">
            <span aria-hidden="true">«</span>
          </button>
        </div>
        <p class="caption">本地 Agent 工作空间<br /><span id="version">桌面开发版</span></p>
        <button data-page="setup" aria-label="首次设置" title="首次设置">
          <span class="nav-icon" aria-hidden="true">☷</span><span class="nav-label">首次设置</span>
        </button>
        <button data-page="agent" aria-label="Agent" title="Agent">
          <span class="nav-icon" aria-hidden="true">◫</span><span class="nav-label">Agent</span>
        </button>
        <button data-page="permissions" aria-label="连接与权限" title="连接与权限">
          <span class="nav-icon" aria-hidden="true">◎</span
          ><span class="nav-label">连接与权限</span>
        </button>
        <button data-page="approvals" aria-label="独立审批" title="独立审批">
          <span class="nav-icon" aria-hidden="true">◇</span><span class="nav-label">独立审批</span>
          <span id="approvals-badge" class="badge"></span>
        </button>
        <button data-page="activity" aria-label="活动记录" title="活动记录">
          <span class="nav-icon" aria-hidden="true">≋</span><span class="nav-label">活动记录</span>
        </button>
        <footer>
          <p id="status" class="caption">正在加载…</p>
          <button data-act="disconnect" aria-label="停止并断开 Pi" title="停止并断开 Pi">
            <span class="nav-icon" aria-hidden="true">⏻</span
            ><span class="nav-label">停止并断开 Pi</span>
          </button>
        </footer>
      </nav>
      <section>
        <header class="top">
          <span>个人空间 / <span id="crumb">Agent</span></span
          ><span class="pill">真实 Pi · 受控目录 · 隔离认证</span>
        </header>
        <main>
          <div id="notice" class="notice error" role="status"></div>
          <div id="app"></div>
        </main>
      </section>
    </div>
    <dialog id="modal" aria-labelledby="dialog-title"></dialog>
    <script type="module" src="renderer.mjs"></script>
  </body>
</html>
