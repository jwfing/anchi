name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            pi/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning -x scripts/*.sh guest/*.sh guest/cell-run
      - run: npm ci --prefix desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm ci --prefix pi --ignore-scripts
      - run: make check PYTHON=python

  # Unsigned packaging smoke test: proves the runtime bundle and Electron packager still
  # produce an app from a clean checkout on each supported host. No signing, no upload, no VM.
  package-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: offline
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci --prefix desktop
      - run: npm ci --prefix pi --ignore-scripts
      - run: node desktop/scripts/package.cjs
      - name: Verify artifact
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          case "$RUNNER_OS" in
            macOS) test -d "artifacts/releases/$version/Anchi-darwin-arm64/Anchi.app" ;;
            Linux) cd "artifacts/releases/$version" && sha256sum -c Anchi-linux-x64.tar.gz.sha256 ;;
            *) exit 1 ;;
          esac
