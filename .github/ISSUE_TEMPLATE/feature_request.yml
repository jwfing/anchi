name: Feature request
description: Describe a developer workflow Anchi does not yet support.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the concrete workflow and where it breaks down today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired behavior
      description: Include alternatives or a workaround you have tried.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Access or compatibility needs
      description: Mention relevant runtimes, platforms and accounts, without secrets or private data.
