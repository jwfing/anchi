# Python style for trusted services, host scripts, guest checks and tests.
line-length = 120
target-version = "py311"
extend-exclude = ["artifacts", "desktop", "pi", "prototype"]

[lint]
# Errors and undefined/unused names only; style is handled by `ruff format`.
select = ["E9", "F", "B006", "B008"]

[format]
quote-style = "preserve"
