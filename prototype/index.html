<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安栖 · Agent 工作空间</title>
<style>
:root{--ink:#263c32;--muted:#728177;--line:#dce4d8;--green:#285c44;--bg:#f5f6f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;background:white;border:1px solid var(--line);border-radius:8px;padding:8px 15px;color:var(--ink)}button:hover{background:#e9f0e4;border-color:var(--green)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:var(--green);color:white}.primary:hover{background:#184830}.danger{color:#a14839}.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}nav{padding:30px 18px;background:#ebf0e5;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px}.brand{font-size:25px;letter-spacing:2px;font-weight:600;margin:0 10px}nav button{text-align:left;background:transparent;border:0;padding:12px}.active{background:#d8e5d4!important;font-weight:600}nav footer{margin-top:auto}.caption{font-size:12px;color:var(--muted)}.top{padding:13px 32px;border-bottom:1px solid var(--line);background:#fbfcf8;display:flex;justify-content:space-between;align-items:center;gap:12px}.demo{color:#8d672f;font-size:12px}main{max-width:1150px;margin:auto;padding:36px}h1{font-size:30px;font-weight:600;line-height:1.35;margin:0 0 12px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 5px}p{margin:8px 0 16px}.muted{color:var(--muted)}.eyebrow{color:var(--green);font-size:11px;letter-spacing:2px;font-weight:700;margin-bottom:17px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px;margin:18px 0}.hero{max-width:740px;margin:45px auto;padding:45px}.hero h1{font-size:36px}.row{display:flex;justify-content:space-between;align-items:center;gap:15px}.actions{display:flex;gap:8px;flex-wrap:wrap}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:30px 0}.steps>div{border-top:2px solid #c0d0b8;padding-top:15px}.num{font:35px Georgia;color:#9aaf90;display:block;margin-bottom:10px}.tag{display:inline-block;padding:3px 8px;background:#e8f0e2;color:var(--green);border-radius:5px;font-size:12px}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:25px 0}.tabs button{border:0;border-radius:0;background:transparent;padding:10px 0}.tabs .selected{border-bottom:2px solid var(--green);font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:24px}.aside{align-self:start}.resource{padding:16px 0;border-bottom:1px solid #e9eee5}.resource:last-child{border:0}.note{background:#f0f5eb;border-left:3px solid #8ca782;padding:12px 15px;margin:16px 0;font-size:13px}.bubble{padding:16px 20px;border-radius:12px;background:white;border:1px solid var(--line);margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#e7eee1;margin-left:35px}.approval{background:#fcfef8;border:1px solid #9fb598;border-radius:12px;padding:24px;margin:18px 0}dl{display:grid;grid-template-columns:80px 1fr;gap:9px}dt{color:var(--muted)}dd{margin:0}.composer{display:flex;align-items:flex-end;gap:12px;margin-top:25px}textarea{width:100%;min-height:85px;resize:vertical;border:1px solid var(--line);padding:13px;border-radius:10px}label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px}input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:white;padding:9px;color:var(--ink)}dialog{width:min(530px,calc(100vw - 30px));border:1px solid var(--line);border-radius:15px;padding:28px;color:var(--ink);max-height:90vh;overflow:auto;box-shadow:0 25px 100px #18352233}dialog::backdrop{background:#142a2255;backdrop-filter:blur(3px)}.dialogfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.error{color:#a14839}.log{display:grid;grid-template-columns:85px 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;border-radius:10px;z-index:9;max-width:90vw}button:focus-visible{outline:3px solid #92b184;outline-offset:3px}@media(max-width:900px){.shell{grid-template-columns:160px 1fr}.layout{grid-template-columns:1fr}main{padding:24px}.hero{padding:26px}}@media(max-width:580px){.shell{display:block}nav{flex-direction:row;flex-wrap:wrap;padding:12px}nav footer,nav>.caption{display:none}.brand{font-size:20px}main{padding:18px}.top,.row{flex-wrap:wrap}.hero{margin:15px auto}.hero h1{font-size:28px}}
</style>
<div class="shell"><nav><div class="brand">◈ 安栖</div><p class="caption">本地 Agent 工作空间 · 暂定名</p><button data-page="agent">◫　Agent</button><button data-page="accounts">◎　账户</button><button data-page="activity">≋　活动记录</button><footer><p id="env" class="caption"></p><button data-act="stop">停止全部 agent</button></footer></nav><section><header class="top"><span>个人空间 / <span id="crumb"></span></span><span class="demo">交互原型 · 全部为模拟数据 <button data-act="reset">重置</button></span></header><main id="app"></main></section></div><dialog id="modal" aria-labelledby="modal-title"></dialog><div id="notice" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(text,act,cls='')=>'<button class="'+cls+'" data-act="'+act+'">'+text+'</button>';
const paths={source:'~/Documents/项目资料',output:'~/Documents/整理结果',temp:'~/Downloads/临时附件'};
function init(){return {ready:false,installed:false,name:'工作助理',page:'agent',tab:'chat',dirs:[],gmail:false,policy:'ask',task:'idle',messages:[],logs:[],limit:20,minutes:30,deadline:0,result:false,seq:0}}
let s=init(),expiryTimer,noticeTimer;
function log(text){s.logs.unshift({time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),text})}
function toast(text){clearTimeout(noticeTimer);$('#notice').innerHTML='<div class="toast">'+esc(text)+'</div>';noticeTimer=setTimeout(()=>$('#notice').innerHTML='',3500)}
function modal(title,body,buttons){$('#modal').innerHTML='<h2 id="modal-title">'+title+'</h2>'+body+'<div class="dialogfoot">'+btn('取消','close')+buttons+'</div>';$('#modal').showModal()}
function close(){$('#modal').close()}
function end(status){clearTimeout(expiryTimer);s.deadline=0;s.task=status;const count=s.dirs.filter(d=>d.duration==='task').length;s.dirs=s.dirs.filter(d=>d.duration!=='task');if(count)log('已收回 '+count+' 项任务目录授权（模拟）')}
function summary(){return '<h3>当前访问范围</h3><div class="resource">自己的工作空间<div class="caption">读写 · 持续可用</div></div>'+s.dirs.map(d=>'<div class="resource">'+esc(d.alias)+'<div class="caption">'+(d.mode==='ro'?'只读':'读写')+' · '+(d.duration==='task'?'下一次 / 当前任务':'持续至撤销')+'</div></div>').join('')+'<div class="resource">Gmail<div class="caption">'+(s.task==='running'?'本任务只读 · '+s.limit+' 封 · '+s.minutes+' 分钟内':s.gmail?(s.policy==='deny'?'禁止访问':'已连接 · 尚无有效授权'):'未连接')+'</div></div><p class="caption">示例云模型 · 任务内容可能发送至模型服务</p>'+btn('管理权限','permissions')}
function render(){
 $('#env').textContent=s.ready?'● 环境可用（模拟）':'○ 环境尚未创建';
 document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===s.page));
 $('#crumb').textContent=s.page==='accounts'?'账户':s.page==='activity'?'活动记录':s.installed?s.name:'开始使用';
 if(s.page==='activity'){$('#app').innerHTML='<div class="eyebrow">ACTIVITY</div><h1>每一次访问，都有记录</h1><p class="muted">区分请求、权限决策与执行结果。以下为本次模拟记录。</p><div class="card">'+(s.logs.length?s.logs.map(l=>'<div class="log"><span class="caption">'+esc(l.time)+'</span><span>'+esc(l.text)+'</span></div>').join(''):'暂无活动。')+'</div>';return}
 if(s.page==='accounts'){$('#app').innerHTML='<div class="eyebrow">CONNECTIONS</div><h1>账户由环境托管</h1><p class="muted">连接一次，为每个 agent 单独授权。</p><div class="card row"><div><h2>Gmail</h2><p class="muted">'+(s.gmail?'work@example.com · 示例工作邮箱':'连接后，agent 仍需获得访问许可。')+'</p><span class="tag">'+(s.gmail?'已连接 · OAuth 只读':'未连接')+'</span></div>'+btn(s.gmail?'断开账户':'连接 Gmail',s.gmail?'disconnect':'gmail')+'</div><div class="note">此原型不会发起真实 OAuth，不收集任何凭证。</div>';return}
 if(!s.ready){$('#app').innerHTML='<div class="card hero"><div class="eyebrow">YOUR AGENT. YOUR BOUNDARIES.</div><h1>让 agent 开始工作，<br>把权限留在你手中。</h1><p class="muted">在独立的本地环境中运行你的助理。由你决定它能读取的资料、使用的账户和修改的文件。</p><div class="steps"><div><span class="num">01</span>创建环境</div><div><span class="num">02</span>安装 agent</div><div><span class="num">03</span>按需授权</div></div>'+btn('创建本地运行环境','setup','primary')+'<p class="caption">模拟体验，不会下载软件或启动虚拟机。</p></div>';return}
 if(!s.installed){$('#app').innerHTML='<div class="eyebrow">AGENTS</div><h1>你的第一个工作伙伴</h1><p class="muted">每个实例拥有独立空间与权限。</p><div class="card row"><div><h2>π　Pi</h2><span class="muted">轻量、可扩展的 agent · 已适配入口</span></div>'+btn('添加 Pi','install','primary')+'</div><p class="caption">Hermes 与自定义安装将在后续适配。</p>';return}
 $('#app').innerHTML='<div class="row"><div><div class="eyebrow">PI / PERSONAL AGENT</div><h1>'+esc(s.name)+'</h1><span class="muted">独立工作空间</span></div><span class="tag">'+({idle:'准备就绪',pending:'等待授权',running:'任务执行中',done:'任务完成',stopped:'任务已停止'}[s.task])+'</span></div><div class="tabs">'+['chat','permissions','files'].map((t,i)=>'<button data-tab="'+t+'" class="'+(s.tab===t?'selected':'')+'">'+['聊天','连接与权限','工作文件'][i]+'</button>').join('')+'</div>'+(s.tab==='permissions'?resources():s.tab==='files'?files():chat());
}
function resources(){return '<h2>决定它能接触什么</h2><p class="muted">新增资源需要你明确授权。</p><div class="card"><div class="row"><h2>本地目录</h2>'+btn('＋ 添加目录','folder')+'</div>'+(s.dirs.length?s.dirs.map(d=>'<div class="resource row"><div><strong>'+esc(d.alias)+'</strong> <span class="tag">'+(d.mode==='ro'?'只读':'读写')+'</span><div class="caption">'+esc(paths[d.key])+' · '+(d.duration==='task'?'下一次 / 当前任务':'持续至撤销')+'</div></div><div class="actions"><button data-edit="'+d.key+'">修改</button><button class="danger" data-revoke="'+d.key+'">撤销</button></div></div>').join(''):'<p class="muted">尚未开放本地目录。</p>')+'<div class="note">建议资料目录只读，结果目录读写。读写包括覆盖和删除原文件。</div></div><div class="card row"><div><h2>Gmail</h2><p class="muted">'+(s.gmail?'work@example.com · 已连接':'未连接账户')+'</p><span class="tag">'+(s.gmail?(s.policy==='deny'?'禁止访问':'每次任务询问'):'尚未授权')+'</span></div>'+btn(s.gmail?'设置权限':'连接 Gmail',s.gmail?'policy':'gmail')+'</div><div class="card"><h2>模型与用量</h2><span class="tag">示例云模型 · 模拟连接</span><p class="muted">文件和邮件内容可能发送至此模型。原型不连接真实模型、不产生费用。</p></div>'}
function files(){return '<h2>工作文件</h2><p class="muted">agent 的生成结果。原始宿主目录不属于实例可删除数据。</p><div class="card">'+(s.result?'<div class="row"><div><h3>本周进展.md</h3><span class="caption">演示结果 · 未写入真实磁盘</span></div>'+btn('预览','preview')+'</div>':'完成示例任务后，结果会出现在这里。')+'</div>'}
function approval(){return '<div class="approval"><span class="tag">◈ 运行环境 · 权限请求</span><h2 style="margin-top:16px">允许读取今天的工作邮件？</h2><dl><dt>请求者</dt><dd>'+esc(s.name)+' · 任务 #'+s.seq+'</dd><dt>账户</dt><dd>work@example.com（示例）</dd><dt>范围</dt><dd>'+new Date().toLocaleDateString('zh-CN')+' 00:00–24:00<br>'+esc(Intl.DateTimeFormat().resolvedOptions().timeZone)+'</dd><dt>数量 / 字段</dt><dd>最多 '+s.limit+' 封；发件人、主题、正文</dd><dt>数据去向</dt><dd>示例云模型</dd><dt>有效期</dt><dd>本任务，最长 '+s.minutes+' 分钟</dd><dt>声明用途</dt><dd>生成进展报告（agent 声明）</dd></dl><div class="actions">'+btn('允许本次','approve','primary')+btn('调整范围','adjust')+btn('拒绝','deny')+'</div><p class="caption">只读，不能发送或删除邮件。</p></div>'}
function chat(){return '<div class="layout"><div>'+(s.messages.length?s.messages.map(m=>'<div class="bubble '+m.role+'"><span class="caption">'+(m.role==='user'?'你':'Pi · 演示回复')+'</span><br>'+esc(m.text)+'</div>').join(''):'<div class="card"><div class="eyebrow">开始一个有边界的任务</div><h2>资料交给它，范围由你决定。</h2><p class="muted">在「连接与权限」开放项目资料、结果目录，并连接 Gmail。</p>'+btn('填入示例需求 ↗','example')+'</div>')+(s.task==='pending'?approval():'')+(s.task==='running'?'<div class="approval"><span class="tag">授权已生效</span><h3 style="margin-top:15px">在批准的范围内开始工作</h3><p class="muted">原型由你推进模拟执行，也可以先撤销权限。</p><div class="actions">'+btn('模拟执行并生成结果','complete','primary')+btn('停止任务','cancel')+'</div></div>':'')+(s.result?btn('查看本周进展.md ↗','preview'):'')+'<form id="composer" class="composer"><textarea id="prompt" aria-label="任务需求" placeholder="描述你希望 agent 完成的任务…" '+(['pending','running'].includes(s.task)?'disabled':'')+'></textarea><button class="primary" '+(['pending','running'].includes(s.task)?'disabled':'')+'>发送</button></form><p class="caption">固定邮件报告流程演示，不连接真实 agent。新任务不继承临时授权。</p></div><aside class="card aside">'+summary()+'</aside></div>'}
function folder(key){const d=s.dirs.find(x=>x.key===key);modal(d?'修改目录权限':'开放本地目录','<p class="muted">正式版使用系统目录选择器。此处只选择示例目录，不读取本机文件。</p><label for="dir">目录</label><select id="dir" '+(d?'disabled':'')+'>'+Object.entries(paths).map(([k,v])=>'<option value="'+k+'" '+(k===key?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select><label for="mode">访问权限</label><select id="mode"><option value="ro">只读 · 查看、搜索、读取</option><option value="rw" '+(d?.mode==='rw'?'selected':'')+'>读写 · 包括覆盖、移动和删除</option></select><label for="duration">有效期</label><select id="duration"><option value="persistent">持续开放，直到撤销</option><option value="task" '+(d?.duration==='task'?'selected':'')+'>仅下一次 / 当前任务</option></select><div class="note">包含子目录；链接不能扩大范围。内容可能发送至模型。修改正在使用的权限将先停止任务，关闭旧通道。</div><p class="error" id="folder-error" role="alert"></p>','<button class="primary" data-save="'+(d?key:'')+'">确认'+(d?'修改':'开放')+'</button>')}
const acts={
 close,
 reset(){clearTimeout(expiryTimer);close();s=init();render();toast('演示已重置')},
 permissions(){s.tab='permissions';render()},
 setup(){modal('创建本地运行环境','<p class="muted">选择运行环境的存储位置与资源上限。</p><label>数据位置（示例）</label><input readonly value="~/Library/Application Support/安栖"><div class="note">示例配置：4 CPU · 4 GiB 内存 · 30 GiB 磁盘上限<br>正式版创建前展示实际下载量与剩余空间。</div><p class="caption">本演示不会创建目录、下载镜像或申请系统权限。</p>',btn('模拟创建','created','primary'))},
 created(){s.ready=true;close();log('本地环境初始化完成（模拟）');render()},
 install(){modal('添加 Pi','<p class="muted">来源：Pi 官方项目（pi.dev）<br>PoC 已验证版本：0.85.1；正式安装需校验发行包。</p><label for="name">Agent 名称</label><input id="name" maxlength="40" value="工作助理"><label>模型连接</label><select><option>示例云模型 · 无真实认证</option></select><div class="note">默认只有自己的工作空间，不继承其他 agent 的账户或目录权限。</div>',btn('模拟安装','installed','primary'))},
 installed(){s.name=$('#name').value.trim()||'工作助理';s.installed=true;s.tab='permissions';close();log('安装 '+s.name+'（模拟），未授予个人资源权限');render()},
 folder(){folder()},
 gmail(){modal('连接 Gmail','<p>正式版通过系统浏览器完成 Google OAuth。</p><div class="note">演示账户：work@example.com<br>上游权限：邮件只读<br>真实凭证由环境托管。</div><p class="muted">连接成功后，仍需单独批准 agent 访问。</p>',btn('模拟授权成功','connected','primary'))},
 connected(){s.gmail=true;close();log('示例 Gmail 已连接；未新增 agent 授权');render();toast('已连接，尚未授权 agent 读取')},
 disconnect(){modal('断开 Gmail？','<p>全部 agent 将失去该连接，当前任务将停止。已读取的内容仍保留。</p><p class="caption">真实版需分别确认本地阻断及上游 token 撤销结果。</p>',btn('确认断开','disconnected','danger'))},
 disconnected(){if(['pending','running'].includes(s.task))end('stopped');s.gmail=false;close();log('Gmail 已断开，相关授权已收回（模拟）');render()},
 policy(){modal('Gmail 访问策略','<label for="policy">当前 agent 的权限</label><select id="policy"><option value="ask">每次任务询问</option><option value="deny" '+(s.policy==='deny'?'selected':'')+'>禁止访问</option></select><p class="caption">持续限定读取留待范围策略实现后开放。</p>',btn('保存','save-policy','primary'))},
 'save-policy'(){s.policy=$('#policy').value;if(s.policy==='deny'&&['pending','running'].includes(s.task))end('stopped');close();log('Gmail 策略改为'+(s.policy==='deny'?'禁止访问':'每次任务询问'));render()},
 example(){$('#prompt').value='结合项目资料和今天的邮件，整理一份进展报告，保存到整理结果目录。';$('#prompt').focus()},
 adjust(){modal('调整本次授权','<p>范围保持为今天的工作邮件，只读。</p><label for="limit">最多读取邮件数</label><input id="limit" type="number" min="1" max="20" value="'+s.limit+'"><label for="minutes">最长有效期（分钟）</label><select id="minutes"><option value="10" '+(s.minutes===10?'selected':'')+'>10</option><option value="30" '+(s.minutes===30?'selected':'')+'>30</option></select><p class="caption">更新后仍需明确批准。</p><p id="adjust-error" class="error"></p>',btn('更新请求','save-adjust','primary'))},
 'save-adjust'(){const n=Number($('#limit').value);if(!Number.isInteger(n)||n<1||n>20){$('#adjust-error').textContent='请输入 1–20 之间的整数。';return}s.limit=n;s.minutes=Number($('#minutes').value);close();log('授权请求已调整，等待批准');render()},
 approve(){if(s.task!=='pending'||!s.gmail||s.policy==='deny')return;s.task='running';s.deadline=Date.now()+s.minutes*60000;expiryTimer=setTimeout(()=>{if(s.task==='running'){end('stopped');log('任务授权到期，已停止（模拟）');render()}},s.minutes*60000);log('批准任务 #'+s.seq+'：Gmail 只读，最多 '+s.limit+' 封，'+s.minutes+' 分钟');render()},
 deny(){if(s.task!=='pending')return;end('stopped');s.messages.push({role:'agent',text:'你拒绝了邮件访问，我没有读取邮件。正式版可以继续仅基于本地资料工作；此原型只演示邮件报告流程。'});log('邮件请求被拒绝；未执行读取');render()},
 complete(){if(s.task!=='running')return;if(Date.now()>=s.deadline){end('stopped');log('授权已过期，执行被拒绝');render();return}const n=Math.min(8,s.limit);log('模拟读取 '+n+' 封邮件与项目资料；模拟写入整理结果/本周进展.md');s.messages.push({role:'agent',text:'示例报告已完成，参考了 '+n+' 封模拟邮件与示例资料。本次临时权限已收回。没有读取真实邮件或修改本地文件。'});s.result=true;end('done');log('任务完成；Gmail 临时权限已收回');render()},
 cancel(){end('stopped');log('任务停止，临时权限收回（模拟）；真实在途操作可能仍完成');render()},
 stop(){if(['pending','running'].includes(s.task)){acts.cancel();toast('全部 agent 已停止执行（模拟）')}else toast('没有正在执行的任务')},
 preview(){modal('本周进展.md · 示例预览','<span class="tag">模拟结果 · 未写入磁盘</span><h3 style="margin-top:20px">本周项目进展</h3><p>• 已确认本地 agent 产品定位。<br>• 目录按只读 / 读写分别授权。<br>• 下周继续讨论文件访问与撤销机制。</p><div class="note">目标：整理结果 / 本周进展.md<br>正式版通过可信桌面端验证路径并打开文件。</div>',btn('完成','close','primary'))}
};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.page){s.page=b.dataset.page;render();return}
 if(b.dataset.tab){s.tab=b.dataset.tab;render();return}
 if(b.dataset.edit){folder(b.dataset.edit);return}
 if(b.dataset.revoke){const k=b.dataset.revoke;modal('撤销目录访问？','<p>'+esc(paths[k])+' 将不再开放。</p><p class="muted">正在执行的任务将停止，以关闭已有访问通道。已读取内容和既有修改仍保留。</p>','<button class="danger" data-confirm="'+k+'">确认撤销</button>');return}
 if(b.dataset.confirm){const k=b.dataset.confirm;if(['pending','running'].includes(s.task))end('stopped');s.dirs=s.dirs.filter(d=>d.key!==k);close();log('目录 '+paths[k]+' 访问通道已关闭、授权已撤销（模拟）');render();return}
 if(b.hasAttribute('data-save')){const k=$('#dir').value,editing=b.dataset.save;if(!editing&&s.dirs.some(d=>d.key===k)){$('#folder-error').textContent='目录已经开放，请修改已有授权。';return}const d={key:k,alias:paths[k].split('/').pop(),mode:$('#mode').value,duration:$('#duration').value};if(editing&&['pending','running'].includes(s.task))end('stopped');s.dirs=s.dirs.filter(x=>x.key!==k);s.dirs.push(d);close();log('目录 '+d.alias+' 已'+(editing?'更新':'开放')+'为'+(d.mode==='ro'?'只读':'读写')+'（模拟）');render();return}
 if(b.dataset.act)acts[b.dataset.act]?.()
});
document.addEventListener('submit',e=>{if(e.target.id!=='composer')return;e.preventDefault();const text=$('#prompt').value.trim();if(!text)return;if(!s.gmail){toast('请先连接示例 Gmail');return}if(s.policy==='deny'){toast('Gmail 当前禁止访问，请先修改策略');return}if(!s.dirs.some(d=>d.key==='source')||!s.dirs.some(d=>d.key==='output'&&d.mode==='rw')){toast('示例任务需要「项目资料」可读及「整理结果」读写权限');return}s.seq++;s.result=false;s.messages=[{role:'user',text},{role:'agent',text:'这是固定邮件报告演示。我已具备资料和结果目录权限，读取邮件需要你批准。'}];s.task='pending';log('任务 #'+s.seq+' 等待 Gmail 授权，未读取邮件');render()});
render();
</script></html>
