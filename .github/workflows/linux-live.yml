name: Linux live validation

# Creates the guest from scratch on an x86_64 runner with KVM, installs the trusted
# services and Pi, then runs the same onboarding, isolation and service checks used on
# macOS. Synthetic credentials only: no Codex login, no Google, no model calls.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  # Pushes that can change what runs inside the guest also run the live check on their branch.
  push:
    paths:
      - '.github/workflows/linux-live.yml'
      - 'lima/**'
      - 'guest/**'
      - 'scripts/**'
      - 'services/**'
      - 'systemd/**'
      - 'pi/**'
      - 'desktop/host-tools.json'
      - 'desktop/src/main/downloader.cjs'
      - 'desktop/src/main/platform.cjs'
      - 'desktop/scripts/install-host-tool.cjs'

permissions:
  contents: read

jobs:
  kvm-guest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANCHI_INSTALL_VM: secure-vm-onboarding-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils
          qemu-system-x86_64 --version | head -1
      - name: Install Lima with the app downloader
        run: |
          node desktop/scripts/install-host-tool.cjs lima
          echo "$HOME/.local/share/anchi/tools/lima/current/bin" >> "$GITHUB_PATH"
      - run: limactl --version
      - name: Create the guest and install Pi
        run: bash scripts/install-pi.sh
      - name: Onboarding checks with synthetic credentials
        run: python3 scripts/verify-onboarding.py
      - name: Installer retry keeps state
        run: python3 scripts/verify-onboarding.py --retry
      - name: Isolation and service checks
        run: bash scripts/verify.sh
      - name: Collect Lima logs
        if: always()
        run: |
          mkdir -p logs
          cp "$HOME/.lima/$ANCHI_INSTALL_VM"/*.log logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lima-logs
          path: logs
          if-no-files-found: ignore
      - name: Delete the guest
        if: always()
        run: limactl delete -f "$ANCHI_INSTALL_VM" || true
