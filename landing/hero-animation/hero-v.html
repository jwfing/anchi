<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{
  --bg:#10120f; --panel:#141810; --vmbd:#3a4530; --card:#171c13; --cardbd:#2f3a27; --line:#2c3524;
  --fg:#e6e9dd; --dim:#8f9785; --dim2:#b4bca9; --lime:#c0e889; --lime-rgb:192,232,137;
  --amber:#e4bc78; --amber-rgb:228,188,120; --hub:#1a2214; --hubbd:#4f6340; --row:#12160f; --frame:#3b4730;
}
.light{
  --bg:#f6f7f2; --panel:#eef1e7; --vmbd:#c9d1bb; --card:#ffffff; --cardbd:#dde3d3; --line:#d3dac7;
  --fg:#1d2318; --dim:#7a8270; --dim2:#566050; --lime:#5c8a1c; --lime-rgb:92,138,28;
  --amber:#b7812a; --amber-rgb:183,129,42; --hub:#ffffff; --hubbd:#a9bf8a; --row:#f4f6ef; --frame:#c9d1bb;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:"DejaVu Sans Mono","Noto Sans Mono CJK SC",monospace;color:var(--fg);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:440px;height:500px;background:var(--bg);overflow:hidden}
.a{position:absolute}
svg{position:absolute;left:0;top:0;overflow:visible}
#frame{left:0;top:0;width:440px;height:500px;border:1px solid var(--frame);background:var(--panel)}
#title{left:1px;top:1px;width:438px;height:34px;border-bottom:1px solid var(--frame);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:10px;color:var(--dim)}
#title .dot{display:inline-block;width:5px;height:5px;background:var(--lime);margin-right:6px;vertical-align:middle}
#vm{left:14px;top:54px;width:412px;height:318px;border:1px dashed var(--vmbd);border-radius:10px}
#vmlab{left:26px;top:47px;padding:0 6px;background:var(--panel);font-size:8.5px;letter-spacing:1.5px;color:var(--dim)}
#hubglow{left:40px;top:100px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(var(--lime-rgb),.10),rgba(var(--lime-rgb),0) 65%)}
.cell{top:70px;width:120px;height:84px;border:1px solid var(--cardbd);border-radius:8px;background:var(--card);padding:8px 9px}
.cell .r1{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700}
.cell .tag{position:absolute;right:8px;top:8px;font-size:7.5px;color:var(--dim)}
.cell .r2{font-size:8.5px;color:var(--dim);margin-top:2px;padding-left:19px}
.cell .r3{font-size:8.5px;margin-top:7px;color:var(--dim2);white-space:nowrap}
.cell .r3 .car{color:var(--lime);margin-right:4px}
.cell .cur{display:inline-block;width:4px;height:9px;background:var(--lime);opacity:.5;margin-left:2px;vertical-align:-1px}
.fk{position:absolute;left:9px;bottom:7px;font-size:7.5px;color:var(--dim);border:1px dashed var(--vmbd);border-radius:3px;padding:0 4px;display:flex;gap:3px;align-items:center;height:13px}
.done{position:absolute;right:8px;bottom:8px;font-size:8.5px;color:var(--lime);opacity:0}
.av{width:13px;height:13px;border-radius:3px;border:1px solid var(--lime);display:flex;align-items:center;justify-content:center;flex:none}
.av i{width:4px;height:4px;background:var(--lime);border-radius:1px}
#hub{left:80px;top:200px;width:280px;height:158px;border:1px solid var(--hubbd);border-radius:10px;background:var(--hub);padding:12px 14px}
#hub .hd{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13.5px;font-weight:700}
#hub .sub{text-align:center;font-size:8.5px;color:var(--dim);margin-top:3px}
#hub .vl{font-size:7.5px;letter-spacing:1.5px;color:var(--amber);margin:11px 0 3px;display:flex;align-items:center;gap:6px}
#hub .vl:after{content:"";flex:1;height:1px;background:var(--cardbd)}
#rows{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.row{height:22px;border:1px solid var(--cardbd);border-radius:4px;background:var(--row);display:flex;align-items:center;padding:0 6px;font-size:8px;gap:4px;color:var(--dim2)}
.row .st{margin-left:auto;font-size:7.5px;color:var(--dim)}
.ft{margin-top:10px;padding-top:8px;border-top:1px dashed var(--cardbd);display:flex;justify-content:space-between;font-size:8.5px;color:var(--dim)}
.ft b{color:var(--lime)}
.svc{top:408px;width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:8.5px;color:var(--dim2)}
.svc .ic{width:34px;height:34px;border-radius:8px;border:1px solid var(--cardbd);background:var(--card);display:flex;align-items:center;justify-content:center}
.svc .ic span{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#1d2318}
#svclab{left:0;top:474px;width:440px;text-align:center;font-size:8px;letter-spacing:1.5px;color:var(--dim)}
#chip{left:220px;top:176px;transform:translateX(-50%);white-space:nowrap;font-size:8.5px;padding:3px 9px;border-radius:999px;border:1px solid rgba(var(--amber-rgb),.6);background:var(--panel);color:var(--amber);opacity:0;display:flex;gap:5px;align-items:center}
</style></head><body>
<div id="stage">
  <div id="frame" class="a"></div>
  <div id="title" class="a"><span><span style="color:var(--lime)">❯</span> anchi / team</span><span><span class="dot"></span>local</span></div>
  <div id="vm" class="a"></div><div id="vmlab" class="a" data-t="vm"></div>
  <div id="hubglow" class="a"></div>
  <svg id="lines" width="440" height="500"></svg>
  <div id="cells"></div>
  <div id="hub" class="a">
    <div class="hd"><svg width="16" height="16" viewBox="0 0 18 18" style="position:static"><path d="M2 16 L9 2 L16 16 M9 2 V16 M5.5 10 H12.5" fill="none" stroke="var(--lime)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><span data-t="gw"></span></div>
    <div class="sub" data-t="gwSub"></div>
    <div class="vl"><svg width="9" height="10" viewBox="0 0 9 10" style="position:static"><rect x="1" y="4.5" width="7" height="5" rx="1" fill="var(--amber)"/><path d="M2.5 4.5V3a2 2 0 0 1 4 0v1.5" fill="none" stroke="var(--amber)" stroke-width="1.2"/></svg><span data-t="vault"></span></div>
    <div id="rows"></div>
    <div class="ft"><span data-t="ft"></span><b>0</b></div>
  </div>
  <div id="svclab" class="a" data-t="svc"></div>
  <div id="svcs"></div>
  <svg id="fx" width="440" height="500"></svg>
  <div id="chip" class="a"></div>
</div>
<script>
const q=new URLSearchParams(location.search), LANG=q.get('lang')||'zh';
if(q.get('theme')==='light')document.body.classList.add('light');
const T={
 zh:{vm:'LOCAL VM · 隔离 CELL',gw:'可信网关',gwSub:'真实凭据只在这里使用',vault:'VAULT · 真实凭据',fake:'假凭据',sealed:'封存',inuse:'使用中',done:'✓ 完成',
   swap:'假凭据 → 真实凭据',ft:'cell 内的真实凭据',svc:'外部服务 · 请求经网关转发',tasks:['修复登录 bug','审查 PR #42','检查 AWS 账单']},
 en:{vm:'LOCAL VM · ISOLATED CELLS',gw:'Trusted Gateway',gwSub:'real secrets are used only here',vault:'VAULT · REAL SECRETS',fake:'fake key',sealed:'sealed',inuse:'in use',done:'✓ done',
   swap:'fake key → real secret',ft:'real secrets in cells',svc:'EXTERNAL SERVICES · VIA GATEWAY',tasks:['fix login bug','review PR #42','check AWS bill']}
}[LANG];
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T[e.dataset.t]);
const KEY='<svg width="9" height="9" viewBox="0 0 10 10" style="position:static"><circle cx="3" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M5.2 5H9.5M8 5V7" stroke="currentColor" stroke-width="1.1" fill="none"/></svg>';
const CELLS=[{n:'@developer',a:'Codex',x:30},{n:'@reviewer',a:'Claude Code',x:160},{n:'@ops',a:'OpenClaw',x:290}];
CELLS.forEach((c,i)=>{c.cx=c.x+60;document.getElementById('cells').insertAdjacentHTML('beforeend',
 `<div class="a cell" id="cell${i}" style="left:${c.x}px"><span class="tag">0${i+1}</span><div class="r1"><span class="av"><i></i></span>${c.n}</div>
  <div class="r2">${c.a}</div><div class="r3"><span class="car">❯</span>${T.tasks[i]}<span class="cur"></span></div>
  <span class="fk">${KEY}${T.fake}</span><div class="done" id="done${i}">${T.done}</div></div>`)});
const ROWS=['GITHUB_TOKEN','GMAIL_OAUTH','SLACK_TOKEN','TRELLO_KEY','POSTHOG_KEY','AWS_KEY'];
const ROWSHOW=[0,2,4,5];
ROWSHOW.forEach(r=>document.getElementById('rows').insertAdjacentHTML('beforeend',
 `<div class="row" id="row${r}"><span style="color:var(--amber);display:flex">${KEY}</span>${ROWS[r]}<span class="st" id="rst${r}"></span></div>`));
const SVC=[['GitHub','#c9d1c0'],['Gmail','#e8a090'],['Slack','#c6a6e0'],['Trello','#8fb8e6'],['PostHog','#f0c070'],['AWS','#f2a65a']];
SVC.forEach((s,i)=>{s.cx=14+412/6*(i+.5);document.getElementById('svcs').insertAdjacentHTML('beforeend',
 `<div class="a svc" id="svc${i}" style="left:${s.cx-28}px"><div class="ic" id="ic${i}"><span style="background:${s[1]}">${s[0][0]}</span></div>${s[0]}</div>`)});

const NS='http://www.w3.org/2000/svg', L=document.getElementById('lines'), FX=document.getElementById('fx');
const HUBT=200, HUBB=358, HX=220;
const inP=CELLS.map((c,i)=>`M${c.cx} 154 C ${c.cx} 180, ${HX-40+i*40} 176, ${HX-40+i*40} ${HUBT}`);
const outP=SVC.map(s=>`M${HX} ${HUBB} C ${HX} 384, ${s.cx} 384, ${s.cx} 408`);
function mk(d,parent,stroke,w){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',stroke);p.setAttribute('stroke-width',w);parent.appendChild(p);return p}
inP.forEach(d=>mk(d,L,'var(--line)',1.2));outP.forEach(d=>mk(d,L,'var(--line)',1.2));
const inTr=inP.map(d=>mk(d,FX,'var(--lime)',2)), outTr=outP.map(d=>mk(d,FX,'var(--amber)',2));
function dot(){const g=document.createElementNS(NS,'g');g.innerHTML='<circle r="10" class="halo"/><circle r="4.5" class="core"/>';FX.appendChild(g);return g}

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const seg=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const win=(t,a,b,f=.25)=>Math.max(0,Math.min(seg(t,a,a+f),1-seg(t,b-f,b)));
const css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();

const FLOWS=[{c:0,s:0,t0:0.3},{c:1,s:2,t0:2.9},{c:2,s:5,t0:5.5},{c:0,s:4,t0:8.1}];
const TOTAL=10.6;
const dots=FLOWS.map(()=>dot());
function trail(p,s,tl,o){const Ln=p.getTotalLength();p.style.opacity=o;p.setAttribute('stroke-dasharray',`${tl} ${Ln+tl+10}`);p.setAttribute('stroke-dashoffset',`${-(s-tl)}`)}
function place(g,p,frac,kind,o){
  const Ln=p.getTotalLength(),pt=p.getPointAtLength(clamp(frac)*Ln);g.setAttribute('transform',`translate(${pt.x},${pt.y})`);g.style.opacity=o;
  const core=g.querySelector('.core'),halo=g.querySelector('.halo');
  if(kind==='fake'){core.setAttribute('r',4.5);core.setAttribute('fill',css('--bg'));core.setAttribute('stroke',css('--dim2'));core.setAttribute('stroke-width',1.6);core.setAttribute('stroke-dasharray','2.2 1.8');halo.setAttribute('fill','transparent')}
  if(kind==='real'){core.setAttribute('r',5);core.setAttribute('fill',css('--amber'));core.setAttribute('stroke','none');core.removeAttribute('stroke-dasharray');halo.setAttribute('fill',`rgba(${css('--amber-rgb')},.22)`)}
  if(kind==='resp'){core.setAttribute('r',3.6);core.setAttribute('fill',css('--lime'));core.setAttribute('stroke','none');core.removeAttribute('stroke-dasharray');halo.setAttribute('fill',`rgba(${css('--lime-rgb')},.2)`)}
  return Ln*clamp(frac);
}
function glowEl(el,k,rgb){el.style.boxShadow=k>0.01?`0 0 ${20*k}px ${2*k}px rgba(${rgb},${.28*k}), 0 0 0 1px rgba(${rgb},${.9*k})`:''}

function render(t){
  t=((t%TOTAL)+TOTAL)%TOTAL;
  const LR=css('--lime-rgb'),AR=css('--amber-rgb');
  const cellK=[0,0,0],svcK=SVC.map(()=>0),rowK={},doneK=[0,0,0];let hubK=0,chipK=0;
  inTr.forEach(p=>p.style.opacity=0);outTr.forEach(p=>p.style.opacity=0);
  FLOWS.forEach((f,i)=>{
    const g=dots[i],u=t-f.t0;g.style.opacity=0;
    const pin=inTr[f.c],pout=outTr[f.s];
    const A1=.8, B1=1.45, C1=2.1, D0=2.25, D1=2.7, E1=3.15;
    if(u<0||u>3.9)return;
    cellK[f.c]=Math.max(cellK[f.c],win(u,-.1,.95),win(u,E1-.15,E1+.6));
    if(u<A1){const s=place(g,pin,seg(u,0,A1),'fake',seg(u,0,.15));pin.setAttribute('stroke',css('--dim2'));trail(pin,s,40,.55)}
    else if(u<B1){chipK=Math.max(chipK,win(u,A1,B1+.35,.15));rowK[f.s]=1}
    else if(u<C1){const s=place(g,pout,seg(u,B1,C1),'real',1);pout.setAttribute('stroke',css('--amber'));trail(pout,s,40,.9);rowK[f.s]=Math.max(rowK[f.s]||0,1-seg(u,B1,C1)*.6);chipK=Math.max(chipK,1-seg(u,B1+.2,B1+.45))}
    else if(u<D0){}
    else if(u<E1){
      const back=u<D1, p=back?pout:pin, s=place(g,p,1-(back?seg(u,D0,D1):seg(u,D1,E1)),'resp',1);
      p.setAttribute('stroke',css('--lime'));const Ln=p.getTotalLength();p.style.opacity=.85;p.setAttribute('stroke-dasharray',`32 ${Ln+40}`);p.setAttribute('stroke-dashoffset',`${-s}`);
    }
    hubK=Math.max(hubK,win(u,A1-.15,C1-.2)*.9);
    svcK[f.s]=Math.max(svcK[f.s],win(u,C1-.1,D0+.6));
    doneK[f.c]=Math.max(doneK[f.c],win(u,E1-.05,E1+.65,.15));
  });
  CELLS.forEach((c,i)=>{glowEl(document.getElementById('cell'+i),cellK[i],LR);document.getElementById('done'+i).style.opacity=doneK[i];
    document.querySelector(`#cell${i} .cur`).style.opacity=(Math.floor(t*2)%2)?.15:.6});
  SVC.forEach((s,i)=>{glowEl(document.getElementById('ic'+i),svcK[i],AR);document.getElementById('svc'+i).style.color=svcK[i]>.3?css('--fg'):''});
  glowEl(document.getElementById('hub'),hubK*.9,LR);
  document.getElementById('hubglow').style.opacity=.6+.4*hubK;
  ROWSHOW.forEach(r=>{const k=rowK[r]||0,el=document.getElementById('row'+r),st=document.getElementById('rst'+r);
    el.style.borderColor=k>.05?`rgba(${AR},${.4+.6*k})`:'';el.style.background=k>.05?`rgba(${AR},${.12*k})`:'';
    st.textContent=k>.3?'●':'';st.style.color=css('--amber')});
  const chip=document.getElementById('chip');chip.innerHTML=KEY+T.swap;chip.style.opacity=chipK;chip.style.transform=`translateX(-50%) translateY(${(1-chipK)*4}px)`;
}
window.render=render;window.TOTAL=TOTAL;
if(!navigator.webdriver){const s=performance.now();(function f(){render((performance.now()-s)/1000);requestAnimationFrame(f)})()}else render(0);
</script></body></html>
